<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render(D) {
  const $ = (id) => document.getElementById(id);
  const STATE = {
    checked: { label: "証明済み", cls: "s-checked", v: "--ok", bg: "--ok-bg" },
    open: { label: "未解決", cls: "s-open", v: "--open", bg: "--open-bg" },
    refuted: { label: "反証済み", cls: "s-refuted", v: "--bad", bg: "--bad-bg" },
    exhausted: { label: "試行上限", cls: "s-dead", v: "--dead", bg: "--dead-bg" },
    work: { label: "作業中", cls: "s-work", v: "--work", bg: "--work-bg" },
  };
  const nodes = D.nodes || [];
  const failures = D.failures || [];
  const spend = D.spend || [];
  const reductions = D.reductions || [];
  const uses = D.uses || {};
  const accepted = D.accepted || [];
  const events = D.events || [];
  const attempts = D.attempts || [];

  const busy = new Set((D.running || []).map((r) => r.node));
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const stateOf = (n) => (!n ? "open" : n.status !== "open" ? n.status : busy.has(n.id) ? "work" : n.exhausted ? "exhausted" : "open");
  const pill = (st) => `<span class="pill ${(STATE[st] || STATE.open).cls}">${(STATE[st] || STATE.open).label}</span>`;
  const TIER_NAME = { T1: "T1 動作確認", T2: "T2 実用補題", T3: "T3 M₃ ⇒ M₂", Tinf: "T∞ 本題" };
  const fmtTime = (t) => {
    if (!t) return "—";
    const d = new Date(t * 1000);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const fmtTs = (ts) => (typeof ts === "string" ? ts.slice(5, 16).replace("T", " ") : typeof ts === "number" ? fmtTime(ts) : "");
  const parseAxioms = (ax) => {
    if (Array.isArray(ax)) return ax.join(", ");
    if (typeof ax === "string") {
      try { const p = JSON.parse(ax); return Array.isArray(p) ? p.join(", ") : String(p); }
      catch { return ax; }
    }
    return "";
  };

  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const label = (n) => (!n ? "" : n.goal ? (n.goal === "Tinf" ? "T∞" : n.goal) : n.id);

  // 判定
  const main = nodes.find((n) => n.goal === "Tinf") || nodes[0];
  const goals = nodes.filter((n) => n.goal);
  $("verdict").innerHTML = `${pill(stateOf(main))}<span>本題は未解決。周辺の目標は ${goals.filter((n) => n.status === "checked").length} / ${goals.length} 件が証明済み。</span>`;

  // 件数
  const gaveUp = failures.filter((f) => f.outcome === "gave_up").length;
  const usd = spend.reduce((a, s) => a + Number(s.usd || 0), 0);
  const tallies = [
    [nodes.filter((n) => n.status === "checked").length, "証明済みの命題"],
    [nodes.filter((n) => n.status === "refuted").length, "反証された命題"],
    [gaveUp, "断念した試み"],
    [reductions.filter((r) => r.status !== "dead").length, "受理された帰着"],
    [D.sessions ?? 0, "AI のセッション"],
    ["$" + usd.toFixed(2), "使った API 費用"],
  ];
  $("tally").innerHTML = tallies.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");

  // 段階
  const tiers = ["T1", "T2", "T3", "Tinf"];
  $("tiers").innerHTML = tiers.map((t) => {
    const ns = nodes.filter((n) => n.tier === t);
    const gs = ns.filter((n) => n.goal), ok = gs.filter((n) => n.status === "checked").length;
    const lem = ns.filter((n) => !n.goal), lok = lem.filter((n) => n.status === "checked").length;
    const pct = gs.length ? Math.round((ok / gs.length) * 100) : 0;
    return `<div class="tier"><header><b>${TIER_NAME[t]}</b><span class="mono">${ok}/${gs.length}</span></header>
      <div class="bar" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
      <p>${gs.map((g) => esc(g.informal)).join(" · ")}${lem.length ? `<br>補題 ${lok}/${lem.length} 件が証明済み` : ""}</p></div>`;
  }).join("");

  // 依存マップ（段階ごとの列、補題は親の右隣の列）
  const cols = [];
  tiers.forEach((t) => {
    cols.push(nodes.filter((n) => n.tier === t && n.goal));
    const lem = nodes.filter((n) => n.tier === t && !n.goal);
    if (lem.length) cols.push(lem);
  });
  const W = 180, H = 62, GX = 70, GY = 26, PAD = 30, TOP = 44;
  const pos = {};
  const maxRows = Math.max(1, ...cols.map((c) => c.length));
  const height = TOP + maxRows * (H + GY) + PAD;
  cols.forEach((c, i) => {
    const off = (maxRows - c.length) * (H + GY) / 2;
    c.forEach((n, j) => { pos[n.id] = { x: PAD + i * (W + GX), y: TOP + off + j * (H + GY) }; });
  });
  const width = PAD * 2 + cols.length * W + Math.max(0, cols.length - 1) * GX;
  const svg = $("map");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  const edges = [];
  reductions.forEach((r) => (r.children || []).forEach((c) => edges.push({ from: r.parent, to: c, kind: "and", rid: r.id, dead: r.status === "dead" })));
  Object.entries(uses).forEach(([mod, u]) => (u.imports || []).forEach((imp) => {
    const to = imp.replace("Proofs.", "");
    if (byId[mod] && byId[to]) edges.push({ from: mod, to, kind: "use" });
  }));
  const parts = [];
  let colI = 0;
  tiers.forEach((t) => {
    const span = nodes.some((n) => n.tier === t && !n.goal) ? 2 : 1;
    const x0 = PAD + colI * (W + GX), x1 = x0 + span * W + (span - 1) * GX;
    parts.push(`<text x="${(x0 + x1) / 2}" y="22" text-anchor="middle" font-size="12" fill="${css("--ink-2")}" font-family="${css("--f-mono")}" letter-spacing="1.5">${TIER_NAME[t]}</text>`);
    colI += span;
  });
  edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const ltr = b.x > a.x;
    const x1 = ltr ? a.x + W : a.x, x2 = ltr ? b.x : b.x + W;
    const y1 = a.y + H / 2, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    const col = e.kind === "and" ? css("--accent") : css("--ink-2");
    parts.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${e.kind === "and" ? 2 : 1.4}" ${e.kind === "use" ? 'stroke-dasharray="5 4"' : ""} ${e.dead ? 'opacity=".35"' : ""} marker-end="url(#ah-${e.kind})"/>`);
    if (e.rid) parts.push(`<text x="${mx}" y="${(y1 + y2) / 2 - 6}" text-anchor="middle" font-size="11" fill="${col}" font-family="${css("--f-mono")}">${esc(e.rid)}</text>`);
  });
  nodes.forEach((n) => {
    const p = pos[n.id];
    if (!p) return;
    const st = STATE[stateOf(n)] || STATE.open;
    const text = (n.informal || "").replace(/（.*$/, "");
    const short = text.length > 15 ? text.slice(0, 14) + "…" : text;
    parts.push(`<g class="node" tabindex="0" role="button" data-id="${esc(n.id)}" aria-label="${esc(label(n))} ${esc(text)} ${st.label}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="${css(st.bg)}" stroke="${css(st.v)}" stroke-width="${n.goal ? 2 : 1.2}" ${n.goal ? "" : 'stroke-dasharray="3 2"'}/>
      <text x="${p.x + 12}" y="${p.y + 24}" font-size="14" font-weight="700" fill="${css(st.v)}" font-family="${css("--f-mono")}">${esc(label(n))}</text>
      <text x="${p.x + W - 12}" y="${p.y + 24}" font-size="11" text-anchor="end" fill="${css(st.v)}" font-family="${css("--f-body")}">${st.label}</text>
      <text x="${p.x + 12}" y="${p.y + 46}" font-size="12.5" fill="${css("--ink")}" font-family="${css("--f-body")}">${esc(short)}</text></g>`);
  });
  const marker = (k, c) => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  svg.innerHTML = `<defs>${marker("and", css("--accent"))}${marker("use", css("--ink-2"))}</defs>` + parts.join("");
  $("legend").innerHTML = ["checked", "work", "open", "refuted", "exhausted"].map((s) => pill(s)).join("") +
    `<span class="ln"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="${css("--accent")}" stroke-width="2"/></svg>帰着（AND）</span>` +
    `<span class="ln"><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="${css("--ink-2")}" stroke-width="1.4" stroke-dasharray="5 4"/></svg>証明で使用</span>` +
    `<span class="ln"><svg width="34" height="14"><rect x="1" y="1" width="32" height="12" rx="3" fill="none" stroke="${css("--ink-2")}" stroke-dasharray="3 2"/></svg>Architect が立てた補題</span>`;

  const failsBy = {};
  failures.forEach((f) => (failsBy[f.node] ||= []).push(f));
  const accBy = Object.fromEntries(accepted.map((a) => [a.module, a]));
  function show(id) {
    const n = byId[id];
    if (!n) return;
    const st = stateOf(n), a = accBy["Proofs." + id];
    const used = edges.filter((e) => e.to === id).map((e) => label(byId[e.from])).filter(Boolean);
    const needs = edges.filter((e) => e.from === id).map((e) => label(byId[e.to])).filter(Boolean);
    const f = failsBy[id] || [];
    const att = n.attempts || { prove: 0, decompose: 0, refute: 0 };
    $("detail").innerHTML = `<h3><span class="mono">${esc(label(n))}</span>${pill(st)}<span style="font-weight:500">${esc(n.informal)}</span></h3>
      <pre>${esc(n.stmt)}</pre>
      <div style="font-size:.86rem;color:var(--ink-2)">
        ${a ? `証明: <span class="mono">${esc(a.module)}</span>（${esc(a.agent)}, ${fmtTime(a.accepted_at)}、${uses[id] ? uses[id].lines + " 行" : ""}、公理 ${esc(parseAxioms(a.axioms))}）<br>` : ""}
        ${needs.length ? `使っている結果: ${needs.map(esc).join(", ")}<br>` : ""}${used.length ? `使われている先: ${used.map(esc).join(", ")}<br>` : ""}
        試行: 証明 ${att.prove ?? 0} / 分解 ${att.decompose ?? 0} / 反証 ${att.refute ?? 0}${f.length ? `（断念 ${f.length} 件は墓場を参照）` : ""}</div>`;
  }
  svg.addEventListener("click", (e) => { const g = e.target.closest(".node"); if (g) show(g.dataset.id); });
  svg.addEventListener("keydown", (e) => { const g = e.target.closest(".node"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(g.dataset.id); } });
  if (main) show(main.id);

  // 台帳
  $("board").innerHTML = nodes.map((n) => {
    const a = accBy["Proofs." + n.id];
    const att = n.attempts || { prove: 0, decompose: 0, refute: 0 };
    return `<tr data-id="${esc(n.id)}"><td class="num">${esc(label(n))}</td><td class="num">${n.tier === "Tinf" ? "T∞" : esc(n.tier)}${n.goal ? "" : " 補題"}</td>
      <td style="min-width:240px">${esc(n.informal)}</td><td>${pill(stateOf(n))}</td>
      <td class="num">${att.prove ?? 0}/${att.decompose ?? 0}/${att.refute ?? 0}</td>
      <td class="num">${a ? esc(a.agent) + "<br>" + fmtTime(a.accepted_at) : "—"}</td></tr>`;
  }).join("");
  $("board").addEventListener("click", (e) => { const tr = e.target.closest("tr"); if (tr) { show(tr.dataset.id); $("map").scrollIntoView({ behavior: "smooth", block: "center" }); } });

  // 経過
  const feed = [];
  events.filter((e) => e.kind === "targets_approved").forEach((e) => feed.push({ t: e.created_at, c: "--accent", h: `研究対象の定義を承認（${esc(e.agent)}）` }));
  accepted.forEach((a) => {
    const n = byId[a.node];
    const nodeName = n ? label(n) : (a.node || "");
    const what = a.kind === "reduction" ? `帰着 <span class="mono">${esc((a.module || "").replace("Proofs.", ""))}</span> を受理: ${esc(nodeName)} を子補題に分解`
      : a.kind === "refutation" ? `<b>${esc(nodeName)}</b> を反証` : `<b>${esc(nodeName)}</b> を証明: ${esc(((n && n.informal) || "").replace(/（.*$/, ""))}`;
    feed.push({ t: a.accepted_at, c: a.kind === "refutation" ? "--bad" : a.kind === "reduction" ? "--accent" : "--ok", h: `${what}（${esc(a.agent)}）` });
  });
  feed.sort((a, b) => (b.t || 0) - (a.t || 0));
  $("feed").innerHTML = feed.map((f) => `<li style="--c:var(${f.c})"><time>${fmtTime(f.t)}</time>${f.h}</li>`).join("");

  // 墓場（ノードごと）
  $("grave").innerHTML = Object.entries(failsBy).sort((a, b) => b[1].length - a[1].length).map(([id, fs]) => {
    const n = byId[id];
    return `<details><summary><span class="mono">${esc(n ? label(n) : id)}</span>${n ? pill(stateOf(n)) : ""}<span>${esc(n ? (n.informal || "").replace(/（.*$/, "") : "")}</span><span class="who">${fs.length} 件</span></summary>
      ${fs.map((f) => `<p><span class="who">${esc(fmtTs(f.ts))} · ${esc(f.agent)} · ${f.task === "prove" ? "証明" : f.task === "refute" ? "反証" : f.task === "decompose" ? "分解" : esc(f.task)}${f.outcome === "no_submission" ? "（中断）" : ""}</span><br>${esc(f.reason)}</p>`).join("")}</details>`;
  }).join("") + `<p class="lede" style="font-size:.82rem">理由は AI 自身が書いたメモです。検証済みの事実ではありません。</p>`;

  // エージェント
  const ROLE = { architect: "分解役", prover: "証明役", redteam: "反証・監査役" };
  $("agents").innerHTML = spend.map((s) => {
    const rows = attempts.filter((a) => a.agent === s.agent);
    const cnt = (o) => rows.filter((r) => r.outcome === o).reduce((x, r) => x + Number(r.n || 0), 0);
    const role = String(s.agent || "").split("-")[0];
    return `<div class="agent"><b>${esc(s.agent)}</b><span style="font-size:.82rem;color:var(--ink-2)">${ROLE[role] || ""}</span>
      <dl><dt>セッション</dt><dd>${s.n ?? 0}</dd><dt>受理</dt><dd>${cnt("accepted")}</dd><dt>断念・中断</dt><dd>${cnt("gave_up") + cnt("no_submission")}</dd>
      ${cnt("reported") ? `<dt>監査報告</dt><dd>${cnt("reported")}</dd>` : ""}<dt>費用</dt><dd>$${Number(s.usd || 0).toFixed(2)}</dd></dl></div>`;
  }).join("");

  $("foot").innerHTML = `<span>データ: ${esc(D.generated_at)} 時点（親機が sync のたびに <span class="mono">status/site.json</span> を更新。開き直すと最新になります）。本日の支出 $${Number(D.spent_today || 0).toFixed(2)}。</span>
    <span>定義の承認ハッシュ <span class="mono">${esc(String(D.targets_hash || "").slice(0, 16))}…</span> · 受理条件: Lean カーネル検査、ロック済み命題との型一致、公理は propext / Classical.choice / Quot.sound のみ。</span>
    <span>リポジトリ: <a href="https://github.com/ruca-maths/nickel" target="_blank" rel="noopener">github.com/ruca-maths/nickel</a></span>`;
}

async function loadSiteJson() {
  const candidates = [
    "./status/site.json",
    "https://raw.githubusercontent.com/ruca-maths/nickel/main/status/site.json"
  ];
  const errors = [];
  for (const url of candidates) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch (e) {
      errors.push(`${url}: ${e.message || e}`);
    }
  }
  throw new Error(errors.join(" / "));
}

loadSiteJson()
  .then((data) => {
    try {
      render(data);
    } catch (e) {
      console.error("Render error:", e);
      document.getElementById("verdict").innerHTML =
        `<span class="pill s-refuted">描画エラー</span><span>データは取得できましたが、表示処理でエラーが発生しました（${esc(String(e))}）。</span>`;
    }
  })
  .catch((e) => {
    console.error("Fetch error:", e);
    document.getElementById("verdict").innerHTML =
      `<span class="pill s-refuted">データを読めません</span><span>status/site.json を取得できませんでした（${esc(String(e))}）。少し待って開き直してください。</span>`;
  });
</script>
