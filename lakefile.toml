name = "mresearch"
defaultTargets = ["Targets"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"   # lean-toolchain と同じタグに固定する

[[lean_lib]]
name = "Targets"

[[lean_lib]]
name = "Specs"
globs = ["Specs.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]
